
name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: v1/pom.xml

      - name: Build and Test with Maven
        working-directory: ./v1
        run: |
          chmod +x mvnw
          ./mvnw clean verify -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: "jdbc:h2:mem:veloce_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: v1/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Comment Coverage on PR
        if: >-
          github.event_name == 'pull_request' &&
          hashFiles('v1/target/site/jacoco/jacoco.xml') != ''
        uses: madrapps/jacoco-report@v1.6
        with:
          paths: v1/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Code Coverage Report"
          min-coverage-overall: 70
          min-coverage-changed-files: 50

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Run OWASP Dependency Check
        working-directory: ./v1
        run: |
          chmod +x mvnw
          ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true

  docker:
    name: Docker Build and Push
    needs: build
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./v1
          push: true
          tags: ghcr.io/${{ github.repository }}/veloce-rent-a-car:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
